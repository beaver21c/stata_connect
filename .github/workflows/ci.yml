name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (Stata 불필요 항목)
        run: python -m pytest -q

  package-windows:
    uses: ./.github/workflows/package-windows.yml

  # SPSS 22~26 대비: 엔진 스크립트를 Python 2.7·3.4에서 실제 실행(가짜 spss 모듈)
  spss-legacy-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["python:2.7-slim", "python:3.4-slim"]
    steps:
      - uses: actions/checkout@v4
      - name: Engine on ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} python tests/legacy/run_engine_check.py

