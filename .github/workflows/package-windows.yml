name: package-windows

# Windows 단일 실행파일 빌드 + 점검(Stata·SPSS 없이). tests·pages 워크플로가 호출.
# 산출물 이름: windows-package (stata-agent·spss-agent 각 <버전>.exe, THIRD_PARTY_NOTICES.txt)
# .mcpb(Claude 데스크톱 확장)는 2026-11-02 폐기(IMPLEMENTATION_STATUS §11.7)
on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # 한글 출력(파이프) 인코딩 오류 방지
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pyinstaller==6.22.3
      - name: Build exe (stata·spss)
        run: python packaging/build.py --out dist
      - name: Smoke test (stata)
        shell: pwsh
        run: python packaging/smoke_test.py (Get-ChildItem dist/stata-agent-*.exe).FullName --product stata
      - name: Smoke test (spss)
        shell: pwsh
        run: python packaging/smoke_test.py (Get-ChildItem dist/spss-agent-*.exe).FullName --product spss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/stata-agent-*.exe
            dist/spss-agent-*.exe
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
