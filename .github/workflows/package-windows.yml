name: package-windows

# Windows 단일 실행파일·.mcpb 빌드 + 점검(Stata·SPSS 없이). tests·pages 워크플로가 호출.
# 산출물 이름: windows-package (stata-agent·spss-agent 각 <버전>.exe·.mcpb, THIRD_PARTY_NOTICES.txt)
on:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # 한글 출력(파이프) 인코딩 오류 방지
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install . pyinstaller==6.22.3
      - name: Build exe + mcpb (stata·spss)
        run: python packaging/build.py --out dist
      - name: Validate manifests (공식 mcpb CLI)
        shell: pwsh
        run: |
          foreach ($p in "stata", "spss") {
            $dir = "dist/_check_$p"
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
            npx -y @anthropic-ai/mcpb@2.1.2 unpack (Get-ChildItem "dist/$p-agent-*.mcpb").FullName $dir
            if ($LASTEXITCODE -ne 0) { exit 1 }
            npx -y @anthropic-ai/mcpb@2.1.2 validate "$dir/manifest.json"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Smoke test (stata)
        shell: pwsh
        run: python packaging/smoke_test.py (Get-ChildItem dist/stata-agent-*.exe).FullName --product stata --mcpb (Get-ChildItem dist/stata-agent-*.mcpb).FullName
      - name: Smoke test (spss)
        shell: pwsh
        run: python packaging/smoke_test.py (Get-ChildItem dist/spss-agent-*.exe).FullName --product spss --mcpb (Get-ChildItem dist/spss-agent-*.mcpb).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/stata-agent-*.exe
            dist/spss-agent-*.exe
            dist/*.mcpb
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
